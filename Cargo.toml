[package]
name = "rusty-broom"
version = "0.1.0"
edition = "2024"
description = "Reclaim disk space from build artifacts of projects you stopped working on"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"

[profile.release]
lto = "thin"
strip = true
