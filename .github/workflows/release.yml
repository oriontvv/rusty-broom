
name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  release-crates:
    needs: release-github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: publish package to crates
        run: |
          cargo package
          cargo publish --token ${{ secrets.CARGO_TOKEN }}

  release-github:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v7

    - name: Get version
      id: get_version
      run: echo ::set-output name=version::${GITHUB_REF/refs\/tags\//}

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        components: clippy

    - name: New Resolver
      run: |
        cargo install cargo-modify --force
        cargo modify new-resolver
    - name: Build
      run: cargo build
    - name: Run tests
      run: make test
    - name: Run clippy
      run: |
        cargo clean
        make clippy
    - name: Setup MUSL
      if: matrix.os == 'ubuntu-latest'
      run: |
        rustup target add x86_64-unknown-linux-musl
        sudo apt-get -qq install musl-tools
    - name: Build Release Mac
      if: matrix.os == 'macos-latest'
      run: make release-mac
    - name: Build Release Linux
      if: matrix.os == 'ubuntu-latest'
      run: make release-linux-musl
    - name: Build Release Win
      if: matrix.os == 'windows-latest'
      run: make release-win

    - name: Set SHA
      if: matrix.os == 'macos-latest'
      id: shasum
      run: |
        echo ::set-output name=sha::"$(shasum -a 256 ./release/rusty-broom-mac.tar.gz | awk '{printf $1}')"
    - name: Extract release notes
      if: matrix.os == 'ubuntu-latest'
      id: release_notes
      uses: ffurrer2/extract-release-notes@v3
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        body: ${{ steps.release_notes.outputs.release_notes }}
        prerelease: ${{ contains(github.ref, '-') }}
        files: |
          ./release/*.tar.gz
          ./release/*.zip
          ./release/*.msi
          
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-homebrew:
    needs: release-github
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download release assets and compute SHA256
        id: hashes
        run: |
          set -e
          VERSION="${{ steps.version.outputs.tag }}"
          BASE_URL="https://github.com/oriontvv/rusty-broom/releases/download/${VERSION}"

          curl -fsSL "${BASE_URL}/rusty-broom-mac.tar.gz" -o rusty-broom-mac.tar.gz
          curl -fsSL "${BASE_URL}/rusty-broom-linux-musl.tar.gz" -o rusty-broom-linux-musl.tar.gz

          echo "mac=$(sha256sum rusty-broom-mac.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux=$(sha256sum rusty-broom-linux-musl.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Generate formula
        id: formula
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          SHA_MAC="${{ steps.hashes.outputs.mac }}"
          SHA_LINUX="${{ steps.hashes.outputs.linux }}"

          cat > rusty-broom.rb <<EOF
          class rusty-broom < Formula
            desc "CLI tool which can convert different formats"
            homepage "https://github.com/oriontvv/rusty-broom"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              url "https://github.com/oriontvv/rusty-broom/releases/download/${VERSION}/rusty-broom-mac.tar.gz"
              sha256 "${SHA_MAC}"
            end

            on_linux do
              url "https://github.com/oriontvv/rusty-broom/releases/download/${VERSION}/rusty-broom-linux-musl.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "rusty-broom"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/rusty-broom --version")
            end
          end
          EOF

          echo "Формула сгенерирована:"
          cat rusty-broom.rb

      - name: Checkout tap repository
        uses: actions/checkout@v7
        with:
          repository: oriontvv/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      - name: Update formula in tap
        run: |
          cp rusty-broom.rb homebrew-tap/Formula/rusty-broom.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rusty-broom.rb
          git commit -m "rusty-broom ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
          git push https://x-access-token:${{secrets.HOMEBREW_TAP_TOKEN}}@github.com/oriontvv/homebrew-tap.git
